name: Kernels

# Builds every baseline kernel in C++ and Fortran and fails if the two languages disagree. The
# kernels and their harness depend on nothing in the compiler, so this runs only when they, the
# toolchain or this file change.
# Times on shared runners are too noisy to gate on; see docs/decisions/0003-benchmark-suite.md.

on:
  push:
    branches: [main]
    paths: &kernel-inputs
      - bench/**
      - .cargo/config.toml
      - .github/workflows/kernels.yml
      - Cargo.lock
      - rust-toolchain.toml
  pull_request:
    paths: *kernel-inputs

permissions:
  contents: read

concurrency:
  group: kernels-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  kernels:
    name: cargo kernels --size smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            fortran: gfortran-14
          - os: ubuntu-24.04
            fortran: gfortran
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Show the compilers
        run: |
          clang++ --version
          ${{ matrix.fortran }} --version
      - name: Build, run and verify every kernel
        run: cargo kernels --size smoke
        env:
          CXX: clang++
          FC: ${{ matrix.fortran }}
