name: Learn site

# Builds docs/ as the Learn site with `cargo xtask learn-site` (roadmap 0.8.9) and publishes it on
# GitHub Pages. A pull request that touches the documentation or the command builds the site, so a
# page that would break it fails before it merges; a push to main also publishes it. GitHub Pages
# must be set to publish from GitHub Actions in the repository's settings.

on:
  push:
    branches: [main]
    paths: ["docs/**", "xtask/**", ".github/workflows/learn.yml"]
  pull_request:
    paths: ["docs/**", "xtask/**", ".github/workflows/learn.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One build per pull request or branch; a newer push cancels the older build, except that a
  # deployment already under way finishes, so the site is never left half published.
  group: learn-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The mdBook release xtask/src/learn_site.rs names, and the SHA-256 of its Linux archive, so a
  # changed download stops the build.
  MDBOOK_VERSION: "0.5.4"
  MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7

jobs:
  build:
    name: Build the Learn site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Install mdBook
        run: |
          archive="mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --silent --show-error --output "$archive" \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/$archive"
          echo "$MDBOOK_SHA256  $archive" | sha256sum --check
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$archive" -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the site
        run: cargo xtask learn-site target/learn-site
      - name: Hand the site to GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/learn-site/html

  deploy:
    name: Publish the Learn site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
