[workspace]
resolver = "3"
members = ["bench", "crates/*", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Baryon-Lang/Baryon"
publish = false

# Every external dependency is declared here, once, with its version.
# Member crates opt in with `name.workspace = true`. See CONTRIBUTING.md, "Dependencies".
[workspace.dependencies]
array_expansion = { path = "crates/array_expansion" }
array_fusion = { path = "crates/array_fusion" }
bounds_hoisting = { path = "crates/bounds_hoisting" }
checker = { path = "crates/checker" }
database = { path = "crates/database" }
diagnostics = { path = "crates/diagnostics" }
documentation = { path = "crates/documentation" }
drop_elaboration = { path = "crates/drop_elaboration" }
llvm_backend = { path = "crates/llvm_backend" }
lowering = { path = "crates/lowering" }
mir = { path = "crates/mir" }
monomorphize = { path = "crates/monomorphize" }
parser = { path = "crates/parser" }
resolver = { path = "crates/resolver" }
source = { path = "crates/source" }
syntax = { path = "crates/syntax" }
syntax_check = { path = "crates/syntax_check" }
types = { path = "crates/types" }

ruff_python_ast = "=0.0.21"
ruff_python_parser = "=0.0.21"
ruff_text_size = "=0.0.21"
# The incremental query engine (decision 0016). Pinned exactly: its API changes between minor
# versions. Default features are off: `inventory` registers queries at startup, `macros` writes
# the query plumbing; parallel queries (`rayon`) are turned on when a stage needs them.
salsa = { version = "=0.28.5", default-features = false, features = ["inventory", "macros"] }
serde_json = "1.0.154"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
missing_crate_level_docs = "warn"
private_intra_doc_links = "warn"
unescaped_backticks = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
missing_docs_in_private_items = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
