[workspace]
resolver = "3"
members = ["bench", "crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/csimpson1964/New-Programming-Language"
publish = false

# Every external dependency is declared here, once, with its version.
# Member crates opt in with `name.workspace = true`. See CONTRIBUTING.md, "Dependencies".
[workspace.dependencies]
diagnostics = { path = "crates/diagnostics" }
source = { path = "crates/source" }

serde_json = "1.0.154"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
missing_crate_level_docs = "warn"
private_intra_doc_links = "warn"
unescaped_backticks = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
missing_docs_in_private_items = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
